<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Work Journal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Work Journal</h1>

  <button onclick="pickFile()">Choose DB File</button>
  <button onclick="openForm()">Add Entry</button>

  <table>
    <thead>
      <tr>
        <th>Location</th>
        <th>Comments</th>
        <th>Weather</th>
        <th>Photos</th>
      </tr>
    </thead>
    <tbody id="journalTable"></tbody>
  </table>

  <div id="entryForm" class="modal">
    <div class="modal-content">
      <label>Location: <input type="text" id="location"></label><br>
      <label>Comments: <textarea id="comments"></textarea></label><br>
      <label>Weather: <input type="text" id="weather"></label><br>
      <label>Photo URL: <input type="text" id="photo"></label><br>
      <button onclick="saveEntry()">Save</button>
      <button onclick="closeForm()">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
