<!DOCTYPE html>
<html lang="en">

<head>
  </link>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Journal</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>Stavpet Utils</h1>
  <div class="top-bar">
    <div class="auth-buttons">
      <button id="loginBtn">Login with Google</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>

    <div class="action-buttons">
      <button id="openFormBtn" style="display:none;">➕ New Work</button>
      <button id="openLocBtn" style="display:none;">➕ New Location</button>
    </div>

    <div class="filter-row">
      <div id="locationSelect" class="custom-select-container"></div>
      <button id="resetFilter" class="reset-btn">Reset</button>
    </div>
  </div>

  <table id="entriesTable">
    <thead>
      <tr>
        <th>Location</th>
        <th>Date</th>
        <th>Weather</th>
        <th>Comments</th>
        <th>Photos</th>
      </tr>
    </thead>
    <tbody id="entriesBody">
    </tbody>
  </table>

  <div id="locModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>New Location</h2>
      <form id="locForm">
        <label>Name:</label><br>
        <input type="text" id="locationName" required><br>
        <button type="submit">Add</button>
      </form>
    </div>
  </div>


  <div id="entryModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>New Work Entry</h2>
      <form id="entryForm">
        <label>Location:</label><br>
        <div id="locationSelectForm" class="custom-select-container"></div><br>
        <label>Date:</label><br>
        <input type="date" id="date" required><br>
        <label>Comments:</label><br>
        <textarea id="comments"></textarea><br>
        <label>Weather:</label><br>
        <input type="text" id="weather"><br>
        <label>Photo URL:</label><br>
        <input type="url" id="photoUrl"><br>
        <button type="submit">Add</button>
      </form>
    </div>
  </div>

  <div id="entries"></div>

  <script type="module" src="script.js"></script>
</body>

</html>
