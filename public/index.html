<!DOCTYPE html>
<html lang="en">

<head>
  </link>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="workJournal"></title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
</head>

<body>
  <div class="login-bar" id="loginScreen">
    <h4>STAVPET</h4>
    <div class="login-button">
      <button id="loginBtn" class="button-submit" data-i18n="login"
        style="width: 250px; height: 100px; text-align: center; font-size: 40px;"></button>
    </div>
    <div class="lang-switcher">
      <button data-lang="en"><img src="https://flagcdn.com/w40/gb.png" alt="English" height="20"> English</button>
      <button data-lang="sk"><img src="https://flagcdn.com/w40/sk.png" alt="Slovak" height="20"> Slovensky</button>
    </div>
  </div>
  <div id="appContainer">
    <div class="sidebar left-sidebar">
      <div class="lang-switcher">
        <button data-lang="en"><img src="https://flagcdn.com/w40/gb.png" alt="English" height="20" width="40"></button>
        <button data-lang="sk"><img src="https://flagcdn.com/w40/sk.png" alt="Slovak" height="20" width="40"></button>
      </div>
      <h2>STAVPET</h2>
      <nav>
        <a href="#" id="navHome" data-i18n="work"></a>
        <a href="#" id="navLocations" data-i18n="locationsPage"></a>
      </nav>
      <div class="bottomSidebar">
        <div class="profile-section">
          <div id="userName" style="text-align: center; padding-bottom: 10px;"></div>
          <!--           <div id="email" style="text-align: center; padding-bottom: 10px;"></div> -->
          <img id="userPhoto" src="https://via.placeholder.com/80" alt="Profile" style="size: 50px;" />
          <div class="auth-buttons">
            <button id="logoutBtn" class="button-cancel" data-i18n="logout"></button>
          </div>
        </div>
      </div>
    </div>
    <div id="homeSection" class="main-content">
      <div class="top">
        <h3 data-i18n="work"></h3>
      </div>
      <div class="actionItems">
        <div class="action-buttons">
          <button id="openFormBtn" data-i18n="newWork" class="button-submit"></button>
          <button id="exportPdf" class="button-submit" data-i18n="exportPdf"></button>
          <div id="locationSelect" class="custom-select-container"></div>
          <button id="resetFilter" class="reset-btn" data-i18n="reset"></button>
        </div>
      </div>
      <table id="entriesTable">
        <thead>
          <tr>
            <th data-i18n="locations"></th>
            <th data-i18n="date"></th>
            <th data-i18n="weather"></th>
            <th data-i18n="comments"></th>
            <th data-i18n="note"></th>
            <th data-i18n="photos"></th>
            <th class="actions-col">-</th>
          </tr>
        </thead>
        <tbody id="entriesBody">
        </tbody>
      </table>

      <div id="entryModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h2 data-i18n="entryDetails"></h2>
          <form id="entryForm">
            <label data-i18n="locations"></label><br>
            <div id="locationSelectForm" class="custom-select-container"></div><br>
            <label data-i18n="date"></label><br>
            <input type="date" id="date" style="padding-left: 10px; font-size: 16px; height: 30px;" required><br>
            <label data-i18n="weather"></label><br>
            <div style="display: flex; align-items: center; gap: 6px;">
              <input type="text" id="weather" style="width: 46%; height: 35px;">
              <select id="weatherSelect" style="width: 46%; height: 41px;"></select><br>
            </div>
            <label data-i18n="comments"></label><br>
            <textarea id="comments"></textarea><br>
            <label data-i18n="note"></label><br>
            <textarea id="note"></textarea><br>
            <label for="photoFile">Attach Photo:</label>
            <input type="file" id="photoFile" accept="image/*" multiple>
            <input type="hidden" id="photoUrl">
            <!--label data-i18n="photos"></label><br-->
            <!--input type="url" id="photoUrl" style="height: 30px; width: 94%;" wrap="soft"><br-->
            <div style="display: flex; gap: 10px;">
              <button type="submit" data-i18n="submit" class="button-submit"></button>
              <button type="button" id="cancelWork" data-i18n="cancel" class="button-cancel cancel"></button>
            </div>
          </form>
        </div>
      </div>
      <div id="entries"></div>
    </div>
    <div id="locationsSection" style="display: none;" class="main-content">
      <div class="top">
        <h3 data-i18n="locationsPage"></h3>
      </div>
      <div class="action-buttons">
        <button id="openLocBtn" data-i18n="newLocation" class="button-submit"></button>
        <input type="text" id="locationSearch" style="margin-bottom: 10px; padding: 6px; width: 100%;">
        <button id="resetLocFilter" class="reset-btn" data-i18n="reset"></button>
      </div>
      <table id="entriesTableLoc">
        <thead>
          <tr>
            <th data-i18n="name"></th>
            <th class="actions-col">-</th>
          </tr>
        </thead>
        <tbody id="entriesBodyLoc">
        </tbody>
      </table>
      <div id="locModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h2 data-i18n="locationDetails"></h2>
          <form id="locForm">
            <label data-i18n="name"></label><br>
            <input type="text" style="width: 80%;" id="locationName" required><br>
            <div style="display: flex; gap: 10px;">
              <button type="submit" data-i18n="submit" class="button-submit"></button>
              <button type="button" id="cancel" data-i18n="cancel" class="button-cancel cancel"></button>
            </div>
          </form>
        </div>
      </div>
      <div id="galleryModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px; text-align: center;">
          <span class="close" id="closeGallery">&times;</span>
          <h3 data-i18n="attached_photos">Attached Photos</h3>
          <hr>
          <div id="galleryGrid"
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; max-height: 70vh; overflow-y: auto;">
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>

</html>
