name: Deploy to Firebase TEST

on: 
  workflow_dispatch: # This ensures it only deploys on a manual run

jobs:
  deploy_live_website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Inject Imgbb API Key
        run: |
          sed -i 's/__IMGBBB_API_KEY__/${{ secrets.IMGBBB_API_KEY }}/g' public/script.js
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAVPETUTILS_TEST }}
          projectId: stavpetutils-test
          channelId: live