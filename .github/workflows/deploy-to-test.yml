name: Inject Imgbb API Key
        run: |
          sed -i 's/__IMGBBB_API_KEY__/${{ secrets.IMGBBB_API_KEY }}/g' public/script.js
name: Deploy to Firebase TEST
on: 
  workflow_dispatch:
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAVPETUTILS }}
          projectId: stavpetutils
          channelId: test